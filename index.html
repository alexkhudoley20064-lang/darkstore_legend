    class SoundEngine {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            this.ctx = new AudioContextClass();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      beep() {
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(1400, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(1700, this.ctx.currentTime + 0.05);
          gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.06);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.065);
        } catch (e) {}
      }
      errorBuzz() {
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(140, this.ctx.currentTime);
          osc.frequency.setValueAtTime(110, this.ctx.currentTime + 0.06);
          gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.16);
        } catch (e) {}
      }
      orderComplete() {
        try {
          this.init();
          if (!this.ctx) return;
          const notes = [523.25, 659.25, 783.99, 1046.50];
          notes.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.06);
            gain.gain.setValueAtTime(0.15, this.ctx.currentTime + idx * 0.06);
            gain.gain.exponentialRampToValueAtTime(0.005, this.ctx.currentTime + idx * 0.06 + 0.35);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(this.ctx.currentTime + idx * 0.06);
            osc.stop(this.ctx.currentTime + idx * 0.06 + 0.38);
          });
        } catch (e) {}
      }

    // 5. ГЕНЕРАТОР ЗАКАЗОВ
    function generateOrder(orderNum) {
      const orderId = `24${String(Math.floor(Math.random() * 899999 + 100000))}`;
      let distinctCount = 2;

      if (orderNum <= 2) {
        distinctCount = 2;
      } else {
        distinctCount = Math.floor(Math.random() * 3) + 3;
      }

      const shuffled = [...PRODUCTS].sort(() => 0.5 - Math.random());
      const selected = shuffled.slice(0, distinctCount);

      const items = selected.map((prod, idx) => {
        const targetCount = (orderNum > 2 && Math.random() > 0.6) ? 2 : 1;
        return {
          id: `item-${Date.now()}-${idx}`,
          productId: prod.id,
          targetCount: targetCount,
          collectedCount: 0,
        };
      });

      return { id: orderId, items };
    }

    const ProductItem = ({ product, onTap, isShaking, isSuccess, isLaserScanning }) => {

            isShaking ? 'animate-shake' : ''
          }`}
        >

            <div className="absolute top-1/2 left-0 right-0 h-1 bg-red-500 laser-line z-30 pointer-events-none rounded-full"></div>
          )}

          <span className="text-[10px] font-bold text-slate-200 drop-shadow-[0_1px_2px_rgba(0,0,0,0.95)] truncate max-w-[62px] text-center mb-1 leading-none">
            {product.name}
          </span>

          <div className={`product-shadow flex items-end justify-center ${
            isSuccess ? 'scale-115 -translate-y-1' : ''
          }`}>
            <ProductIcon id={product.id} aspect={product.aspect} />
          </div>
        </button>
      );
    };

      const sendScoreToSupabase = async (finalScore, ordersCount, currentRankTitle) => {
        if (!supabase || finalScore <= 0) return;
        try {
          const name = playerName.trim() || getDefaultPlayerName();
          await supabase.from('shop_leaderboard').insert([{
            player_name: name,
            score: finalScore,
            orders_completed: ordersCount,

                    {combo >= 3 && (
                      <div className="flex items-center gap-0.5 text-[8px] font-black text-amber-500 uppercase">
                        <FlameSvg size={10} />
                        <span>x{combo >= 5 ? '2.0' : '1.5'}</span>
                      </div>
                    )}
                  </div>
                  <span className="text-[9px] font-mono font-bold bg-slate-100 px-1.5 py-0.5 rounded text-slate-700">
                    {totalItemsCollected}/{totalItemsToCollect}
                  </span>
                </div>
              </div>

              <div className="flex-1 overflow-y-auto space-y-1.5 my-1 pr-0.5">
                {ZONES_ORDER.map(zone => {
                  const zoneItems = currentOrder?.items.filter(item => {
                    const p = PRODUCTS.find(prod => prod.id === item.productId);
                    return p?.department === zone.id;
                  }) || [];

                  if (zoneItems.length === 0) return null;

                  const isCurrentActiveZone = dept === zone.id;

                  return (
                    <div key={zone.id} className="space-y-1">
                      <div className={`px-1.5 py-0.5 rounded text-[8px] font-black uppercase tracking-wider flex items-center justify-between ${
                        isCurrentActiveZone 
                          ? 'bg-orange-500 text-white shadow-xs' 
                          : 'bg-slate-100 text-slate-500'
                      }`}>
                        <div className="flex items-center gap-1">
                          <ZoneSvgIcon zoneId={zone.id} size={11} />
                          <span>{zone.title}</span>
                        </div>
                        {isCurrentActiveZone && <span className="text-[7px] lowercase font-normal opacity-95">вы здесь</span>}
                      </div>

                      <div className="space-y-1">
                        {zoneItems.map(item => {
                          const prod = PRODUCTS.find(p => p.id === item.productId);
                          const isDone = item.collectedCount === item.targetCount;

                          return (
                            <div
                              key={item.id}
                              className={`flex items-center justify-between p-1.5 rounded-xl border text-[10px] transition-all min-h-[44px] ${
                                isDone
                                  ? 'bg-slate-50 border-slate-100 opacity-30 line-through text-slate-400'
                                  : isCurrentActiveZone
                                  ? 'bg-white border-orange-300 ring-1 ring-orange-400/40 shadow-xs'
                                  : 'bg-slate-50/80 border-slate-200 text-slate-700'
                              }`}
                            >
                              <div className="flex items-center gap-1.5 truncate flex-1 min-w-0 mr-1">
                                <div className="shrink-0 drop-shadow-xs">
                                  <ProductIcon id={prod.id} sizeOverride={24} />
                                </div>
                                <div className="flex flex-col truncate min-w-0">
                                  <span className="font-bold text-[10px] text-slate-900 truncate leading-tight">
                                    {prod.name}
                                  </span>
                                  <span className="text-[8px] text-slate-400 font-mono font-medium leading-none">
                                    {prod.price} ₽
                                  </span>
                                </div>
                              </div>

                              <span className={`px-1.5 py-0.5 rounded-md font-mono font-black text-[9px] shrink-0 ${
                                isDone
                                  ? 'bg-emerald-500 text-white'
                                  : 'bg-slate-200 text-slate-800'
                              }`}>
                                {item.collectedCount}/{item.targetCount}
                              </span>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  );
                })}
              </div>

              <div className="py-1.5 bg-orange-500 text-white font-black text-[9px] uppercase tracking-wider rounded-lg text-center shadow-xs shrink-0">
                К сборке: {totalItemsToCollect - totalItemsCollected} шт
              </div>

            </div>
          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
